name: Hotfix CI

on:
  pull_request:
    branches: [hotfix/106-runtime]
  push:
    branches: [hotfix/106-runtime]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotfix-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OPENAI_API_KEY: ''
  OPENROUTER_API_KEY: ''
  NOUS_API_KEY: ''

jobs:
  tests:
    name: Linux tests (${{ matrix.slice }}/8)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install upstream-pinned ripgrep
        shell: bash
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_DIR="$RUNNER_TEMP/hotfix-ripgrep"
          mkdir -p "$RG_DIR"
          RG_TARBALL="ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_DIR/$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          printf '%s  %s\n' "$RG_SHA256" "$RG_DIR/$RG_TARBALL" | sha256sum -c -
          tar -xzf "$RG_DIR/$RG_TARBALL" -C "$RG_DIR"
          printf '%s\n' "$RG_DIR/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          "$RG_DIR/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" --version
      - uses: ./.github/actions/setup-pm
        with:
          packages: pnpm
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "keychain"]'
          test-environment: 'true'
          save-tools-cache: 'false'
          save-python-cache: 'false'
          save-node-cache: 'false'
      - name: Verify SQLite WAL capability
        run: |
          "$HERMES_PYTHON" -c "import hermes_agent.compat as c; c.install(); import hermes_state_wal as w; assert not w.is_sqlite_wal_reset_vulnerable(), 'WAL-reset vulnerable SQLite'"
      - name: Full canonical test suite slice
        run: just test-all
        env:
          HERMES_TEST_SLICE: ${{ matrix.slice }}/8
          HERMES_TEST_FORKSERVER: '1'
          HERMES_TEST_WORKERS: '4'
          HERMES_TEST_FILE_TIMEOUT: '600'
      - uses: ./.github/actions/check-clean-worktree

  lint:
    name: Canonical blocking checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install upstream-pinned ripgrep
        shell: bash
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_DIR="$RUNNER_TEMP/hotfix-ripgrep"
          mkdir -p "$RG_DIR"
          RG_TARBALL="ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_DIR/$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          printf '%s  %s\n' "$RG_SHA256" "$RG_DIR/$RG_TARBALL" | sha256sum -c -
          tar -xzf "$RG_DIR/$RG_TARBALL" -C "$RG_DIR"
          printf '%s\n' "$RG_DIR/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          "$RG_DIR/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" --version
      - uses: ./.github/actions/setup-pm
        with:
          packages: pnpm
          extras: '["all"]'
          test-environment: 'true'
          save-tools-cache: 'false'
          save-python-cache: 'false'
          save-node-cache: 'false'
      - name: Canonical checks against the actual hotfix base
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '4162ecf11f611400fa6e5c42d2f360188ce50b39' }}
        run: |
          git rev-parse --verify "${CHECK_BASE}^{commit}"
          just check --base "$CHECK_BASE"
      - uses: ./.github/actions/check-clean-worktree

  gate:
    name: hotfix-gate
    if: always()
    needs: [tests, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every lane to succeed
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$LINT_RESULT" = success
